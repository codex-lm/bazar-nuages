<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Bazar des nuages — The Cloud Bazaar — El Bazar de las nubes</title>
<meta name="description" content="Run a balloon-hung shop on a floating market: ten days, three customers a day, one voyage to fund. / Tiens une boutique suspendue sur un marché flottant : dix journées, trois clients par jour, un voyage à financer.">
<style>
/* Le Bazar des nuages — marché céleste, clair et festif */
:root {
  --sky-a: #dceef8; --sky-b: #f3faf5;
  --cream: #fdf6e9; --cream-2: #f7ecd7;
  --ink: #2f3b47; --ink-soft: #5c6b7a;
  --coral: #e2624b; --coral-deep: #c74a35;
  --mustard: #e8b64c; --mint: #6fbf9b; --mint-deep: #4d9e79;
  --balloon-blue: #7fb2dd; --rose: #e8a0b4;
  --line: #e3d5bc; --danger: #c74a35;
  --shadow: 0 4px 14px rgba(47, 59, 71, .12);
  --r: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Trebuchet MS", "Segoe UI", Verdana, system-ui, sans-serif;
  color: var(--ink);
  background: linear-gradient(180deg, var(--sky-a) 0%, var(--sky-b) 70%, #eef7ee 100%);
  min-height: 100vh;
  -webkit-text-size-adjust: 100%;
}
#app { max-width: 540px; margin: 0 auto; padding: 10px 12px 28px; }
.screen { display: none; }
.screen.active { display: block; animation: fadeIn .35s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- boutons ---------- */
button {
  font: inherit; color: var(--ink); background: var(--cream);
  border: 2px solid var(--ink); border-radius: 12px;
  padding: 10px 16px; cursor: pointer; font-weight: 700;
  transition: transform .08s ease, box-shadow .08s ease, background .15s;
}
button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
.btn-primary { background: var(--coral); border-color: var(--coral-deep); color: #fff; }
.btn-mint { background: var(--mint); border-color: var(--mint-deep); color: #fff; }
.btn-ghost { background: transparent; border-color: var(--ink-soft); color: var(--ink-soft); padding: 6px 10px; font-weight: 600; }
.btn-big { font-size: 1.15rem; padding: 13px 26px; border-radius: 16px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.icon-btn { padding: 7px 9px; border-radius: 10px; font-size: .95rem; line-height: 1; }

/* ---------- accueil ---------- */
#home { text-align: center; padding-top: 8px; }
.title-art { margin: 0 auto; max-width: 430px; }
h1.game-title {
  font-size: clamp(1.6rem, 6vw, 2.3rem); margin: 6px 0 2px; letter-spacing: .5px;
  color: var(--ink); text-shadow: 0 2px 0 #fff;
}
.tagline { color: var(--ink-soft); margin: 0 0 16px; font-size: 1.02rem; }
.home-buttons { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 6px; }
.home-meta { margin-top: 14px; color: var(--ink-soft); font-size: .85rem; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
select {
  font: inherit; padding: 7px 10px; border-radius: 10px; border: 2px solid var(--ink);
  background: var(--cream); color: var(--ink); font-weight: 700; cursor: pointer;
}

/* ---------- en-tête de partie ---------- */
.gamebar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 4px 0 8px; }
.pill {
  background: var(--cream); border: 2px solid var(--ink); border-radius: 999px;
  padding: 5px 12px; font-weight: 700; font-size: .92rem; white-space: nowrap;
}
.pill .coin { margin-right: 2px; }
.goalwrap { flex: 1; min-width: 130px; background: var(--cream); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 10px; position: relative; height: 34px; }
.goalbar { position: absolute; inset: 3px auto 3px 3px; width: 0%; background: repeating-linear-gradient(45deg, var(--mint), var(--mint) 8px, #8fd4b5 8px, #8fd4b5 16px); border-radius: 999px; transition: width .5s ease; max-width: calc(100% - 6px); }
.goallabel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 800; }
.barbtns { display: flex; gap: 6px; }

/* ---------- scène ---------- */
.scene { position: relative; border-radius: var(--r); overflow: hidden; border: 2px solid var(--ink); background: linear-gradient(180deg, #cfe7f6 0%, #e6f4ef 100%); box-shadow: var(--shadow); }
.scene svg { display: block; width: 100%; height: auto; }
.cloud { animation: drift 26s linear infinite; }
.cloud.c2 { animation-duration: 34s; animation-delay: -12s; }
.cloud.c3 { animation-duration: 42s; animation-delay: -20s; }
@keyframes drift { from { transform: translateX(-90px); } to { transform: translateX(430px); } }
.balloon-float { animation: bob 5s ease-in-out infinite; transform-origin: center; }
.balloon-float.b2 { animation-delay: -1.6s; }
.balloon-float.b3 { animation-delay: -3.2s; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.customer-slot { position: absolute; left: 4%; bottom: 6px; width: 26%; max-width: 110px; }
.customer-slot svg { width: 100%; height: auto; }
.customer-slot.enter { animation: enterCust .45s ease; }
@keyframes enterCust { from { transform: translateX(-30px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
.mood-bubble {
  position: absolute; left: 2%; top: 8%; background: #fff; border: 2px solid var(--ink);
  border-radius: 12px; padding: 4px 9px; font-size: .78rem; font-weight: 700; max-width: 55%;
  box-shadow: var(--shadow); opacity: 0; pointer-events: none;
}
.mood-bubble.show { opacity: 1; transition: opacity .25s; }
.scene.lift-off { animation: lift 2.4s ease-in forwards; }
@keyframes lift { 0% { transform: translateY(0); } 100% { transform: translateY(-120vh); } }

/* ---------- panneaux ---------- */
.panel {
  background: var(--cream); border: 2px solid var(--ink); border-radius: var(--r);
  padding: 14px; margin-top: 10px; box-shadow: var(--shadow);
}
.panel h2 { margin: 0 0 8px; font-size: 1.05rem; }
.hint { color: var(--ink-soft); font-size: .86rem; margin: 4px 0; }
.forecast {
  background: #fff8e6; border: 2px dashed var(--mustard); border-radius: 10px;
  padding: 8px 10px; margin-bottom: 10px; font-size: .92rem;
}
.forecast .star { color: var(--coral); }

/* marché */
.market { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 379px) { .market { grid-template-columns: 1fr; } }
.good-card {
  background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 10px;
  display: flex; flex-direction: column; gap: 6px; position: relative;
}
.good-card.demand { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(226, 98, 75, .18); }
.demand-badge {
  position: absolute; top: -10px; right: -6px; background: var(--coral); color: #fff;
  border: 2px solid var(--ink); border-radius: 999px; font-size: .72rem; padding: 2px 8px; font-weight: 800;
}
.good-head { display: flex; align-items: center; gap: 8px; }
.good-head .gicon { width: 34px; height: 34px; flex: none; }
.good-name { font-weight: 800; font-size: .95rem; line-height: 1.15; }
.tag { display: inline-block; font-size: .7rem; font-weight: 800; border-radius: 6px; padding: 1px 6px; border: 1.5px solid; }
.tag.fresh { color: var(--mint-deep); border-color: var(--mint-deep); background: #e9f7ef; }
.tag.keeps { color: var(--ink-soft); border-color: var(--ink-soft); background: #f1f1ee; }
.price-row { display: flex; align-items: baseline; gap: 6px; font-size: .88rem; }
.price { font-size: 1.25rem; font-weight: 800; }
.trend { font-size: .78rem; font-weight: 700; padding: 1px 6px; border-radius: 6px; }
.trend.up { color: var(--coral-deep); background: #fbe7e2; }
.trend.down { color: var(--mint-deep); background: #e5f4ec; }
.trend.flat { color: var(--ink-soft); background: #eef0ee; }
.stock-row { font-size: .8rem; color: var(--ink-soft); }
.stepper { display: flex; align-items: center; gap: 8px; margin-top: auto; }
.stepper button { width: 40px; height: 36px; padding: 0; font-size: 1.2rem; border-radius: 10px; }
.stepper .qty { min-width: 26px; text-align: center; font-size: 1.15rem; font-weight: 800; }
.cartbar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;
  background: var(--cream-2); border: 2px solid var(--ink); border-radius: 12px;
  padding: 9px 12px; margin-top: 12px; font-size: .92rem; font-weight: 700;
}
.cartbar .warn { color: var(--danger); }

/* client */
.cust-card { background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 12px; margin-top: 10px; }
.cust-head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.cust-avatar { width: 54px; height: 54px; flex: none; border-radius: 50%; border: 2px solid var(--ink); background: var(--cream-2); overflow: hidden; }
.cust-avatar svg { width: 100%; height: 100%; }
.cust-name { font-weight: 800; }
.cust-blurb { color: var(--ink-soft); font-size: .82rem; }
.order-line {
  display: flex; align-items: center; gap: 8px; padding: 8px 6px; border-top: 1.5px dashed var(--line); flex-wrap: wrap;
}
.order-line .gicon { width: 28px; height: 28px; flex: none; }
.order-main { flex: 1; min-width: 130px; }
.order-good { font-weight: 800; font-size: .93rem; }
.order-offer { font-size: .8rem; color: var(--ink-soft); }
.order-math { font-size: .78rem; color: var(--mint-deep); font-weight: 700; }
.order-qty { display: flex; align-items: center; gap: 6px; }
.order-qty .stepper button { width: 36px; height: 32px; }
.payrow {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--cream-2); border-radius: 10px; padding: 8px 12px; margin-top: 8px; font-weight: 800;
}
.payrow .amount { font-size: 1.3rem; }
.cust-actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.cust-actions .btn-primary { flex: 1; min-width: 130px; }

/* récap client */
.recap-card { text-align: center; padding: 18px 12px; }
.recap-card .amount { font-size: 2rem; font-weight: 800; color: var(--mint-deep); }
.recap-card .sad { color: var(--danger); }
.recap-mood { font-size: 1.05rem; font-weight: 700; margin: 6px 0 10px; }

/* fin de journée / modales */
.modal-back {
  position: fixed; inset: 0; background: rgba(47, 59, 71, .45);
  display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
}
.modal {
  background: var(--cream); border: 2px solid var(--ink); border-radius: var(--r);
  max-width: 480px; width: 100%; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
  max-height: 92vh; overflow: auto;
}
.modal h2 { margin-top: 0; }
.ledger { width: 100%; border-collapse: collapse; margin: 8px 0; }
.ledger td { padding: 4px 6px; border-bottom: 1px dashed var(--line); font-size: .92rem; }
.ledger td.num { text-align: right; font-weight: 800; white-space: nowrap; }
.ledger tr.total td { border-bottom: none; border-top: 2px solid var(--ink); font-size: 1.05rem; }
.plus { color: var(--mint-deep); } .minus { color: var(--danger); }

/* améliorations */
.upgrades { display: grid; grid-template-columns: 1fr; gap: 10px; }
.upg-card { background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
.upg-ico { width: 44px; height: 44px; flex: none; }
.upg-card .btn { margin-left: auto; }

/* résultat */
#result { text-align: center; }
.result-title { font-size: clamp(1.4rem, 6vw, 2rem); margin: 10px 0 4px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
.stat { background: var(--cream); border: 2px solid var(--ink); border-radius: 12px; padding: 8px; }
.stat .v { font-size: 1.3rem; font-weight: 800; }
.stat .k { font-size: .78rem; color: var(--ink-soft); }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
.confetti i { position: absolute; top: -20px; left: 0; width: 10px; height: 14px; opacity: .9; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

/* règles / aide */
.rules-list { margin: 0; padding-left: 20px; }
.rules-list li { margin: 8px 0; font-size: .95rem; }
.kbd { background: #fff; border: 1.5px solid var(--ink); border-bottom-width: 3px; border-radius: 6px; padding: 0 6px; font-size: .85em; font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  .cloud, .balloon-float, .customer-slot.enter, .screen.active, .confetti i { animation: none !important; }
  .goalbar { transition: none; }
}

</style>
</head>

<script>
/*ENGINE-START*/
/* =========================================================================
   Le Bazar des nuages — moteur de jeu (logique pure, sans DOM)
   Tout est déterministe par graine : mêmes graines => mêmes journées,
   mêmes prix, mêmes clients. Les calculs sont prévus pour être affichés.
   ========================================================================= */
var Bazar = (function () {
  "use strict";

  /* ---------- RNG déterministe (mulberry32) ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashSeed(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return h >>> 0;
  }

  /* ---------- Constantes d'équilibrage (toutes visibles en jeu) ---------- */
  const RULES = {
    DAYS: 10,            // dix journées
    START_CAPITAL: 30,   // capital initial
    CAPACITY: 6,         // entrepôt : six emplacements (1 emplacement = 1 article)
    MOORING_FEE: 3,      // droit d'amarrage clôturant chaque journée
    GOAL: 62,            // capital visé après 10 jours pour financer le voyage
    CUSTOMERS_PER_DAY: 3,
    DEMAND_COUNT: 2,     // deux marchandises "en demande" par jour
    DEMAND_OFFER: 1.3,   // les clients paient +30 % sur une marchandise en demande
    DEMAND_PENALTY: 0.85, // ... et proposent −15 % sur les autres
    DEMAND_WEIGHT: 5,    // ... et la réclament bien plus souvent (la prévision se lit)
    FRESH_DECAY: 25,     // un article frais perd 25 % de sa valeur par nuit
    FRESH_MIN: 25,       // ... sans jamais descendre sous 25 %
    ICEBOX_DECAY: 10,    // avec la glacière : seulement 10 % par nuit
    SIGN_BONUS: 1.15,    // avec le ballon-enseigne : offres +15 %
    SHELF_EXTRA: 2,      // avec l'étagère : +2 emplacements
    UPGRADE_DAY: 5,      // l'amélioration se choisit au matin du 5e jour
    PRICE_STEPS: [0.8, 0.9, 1.0, 1.1, 1.2] // variation du prix d'achat
  };

  /* ---------- Marchandises (4 familles) ---------- */
  const GOODS = [
    { id: "berries", fresh: true,  buy: 3, sell: 5 },
    { id: "lantern", fresh: true,  buy: 5, sell: 8 },
    { id: "wool",    fresh: false, buy: 4, sell: 6 },
    { id: "tea",     fresh: false, buy: 6, sell: 9 }
  ];
  const GIDX = {};
  GOODS.forEach(function (g, i) { GIDX[g.id] = i; });

  /* ---------- Profils de clients (6) ----------
     taste  : pondération des goûts [goodId, poids]
     lines  : nb de lignes (min,max) — 2 lignes = commande combinée
     qty    : quantité par ligne (min,max)
     gen    : générosité [min,max] (multiplicateur d'offre)
     weight : fréquence d'apparition du profil                                */
  const PROFILES = [
    { id: "kid",      weight: 1.1, taste: [["berries", 3], ["lantern", 2], ["wool", 1]], lines: [1, 1], qty: [1, 2], gen: [0.95, 1.10] },
    { id: "navigator",weight: 1.0, taste: null, lines: [2, 2], qty: [1, 2], gen: [1.00, 1.15] },
    { id: "shepherd", weight: 1.0, taste: [["wool", 2], ["tea", 1]], lines: [1, 1], qty: [2, 4], gen: [0.90, 1.05] },
    { id: "aeronaut", weight: 0.6, taste: [["lantern", 1], ["tea", 1]], lines: [2, 2], qty: [1, 2], gen: [1.20, 1.35] },
    { id: "baker",    weight: 1.0, taste: [["berries", 2], ["lantern", 3]], lines: [1, 2], qty: [2, 3], gen: [1.10, 1.25] },
    { id: "peddler",  weight: 0.9, taste: null, lines: [1, 1], qty: [3, 4], gen: [0.90, 1.00] }
  ];
  const PIDX = {};
  PROFILES.forEach(function (p, i) { PIDX[p.id] = i; });

  /* ---------- i18n (EN par défaut) ---------- */

      },
      custBlurbs: {

  function tr(lang, key, vars) {
    var d = I18N[lang] || I18N.en;
    var s = d[key];
    if (s === undefined) s = I18N.en[key];
    if (s === undefined) return key;
    if (vars) Object.keys(vars).forEach(function (k) {
      s = s.split("{" + k + "}").join(String(vars[k]));
    });
    return s;
  }

  /* ---------- Utilitaires ---------- */
  function ri(R, min, max) { return min + Math.floor(R() * (max - min + 1)); }
  function pickWeighted(R, pairs) { // [[valeur, poids], ...]
    var total = 0; pairs.forEach(function (p) { total += p[1]; });
    var x = R() * total;
    for (var i = 0; i < pairs.length; i++) { x -= pairs[i][1]; if (x <= 0) return pairs[i][0]; }
    return pairs[pairs.length - 1][0];
  }

  /* ---------- Génération d'une journée ---------- */
  function genDay(R, day, prevDemand) {
    var mult = GOODS.map(function () {
      return RULES.PRICE_STEPS[Math.floor(R() * RULES.PRICE_STEPS.length)];
    });
    // Deux marchandises en demande (distinctes, différentes de la veille).
    var ids = GOODS.map(function (g) { return g.id; });
    function pair() {
      var a = ids[Math.floor(R() * ids.length)];
      var b = ids[Math.floor(R() * ids.length)];
      while (b === a) b = ids[Math.floor(R() * ids.length)];
      return [a, b].sort();
    }
    var demand = pair();
    if (prevDemand && demand.join() === prevDemand.join()) demand = pair();
    // Garde-fou jour 1 : au moins une marchandise en demande est ordinaire
    // (le sec se conserve : un départ impossible reste jouable).
    if (day === 1 && GOODS[GIDX[demand[0]]].fresh && GOODS[GIDX[demand[1]]].fresh) {
      demand = [demand[0], "wool"].sort();
    }
    var customers = [];
    for (var c = 0; c < RULES.CUSTOMERS_PER_DAY; c++) {
      customers.push(genCustomer(R, day, demand));
    }
    return { day: day, mult: mult, demand: demand, customers: customers };
  }

  function genCustomer(R, day, demand) {
    var profile = PROFILES[pickWeighted(R, PROFILES.map(function (p) { return [PROFILES.indexOf(p), p.weight]; }))];
    // Goûts : liste pondérée de marchandises (la demande du jour pèse plus lourd).
    var pool = [];
    if (profile.taste) {
      profile.taste.forEach(function (t) {
        var w = t[1] * (demand.indexOf(t[0]) >= 0 ? RULES.DEMAND_WEIGHT : 1);
        pool.push([t[0], w]);
      });
    } else {
      GOODS.forEach(function (g) {
        var w = demand.indexOf(g.id) >= 0 ? RULES.DEMAND_WEIGHT : 1;
        pool.push([g.id, w]);
      });
    }
    var nLines = ri(R, profile.lines[0], profile.lines[1]);
    var chosen = [];
    var used = {};
    for (var i = 0; i < nLines; i++) {
      var g = pickWeighted(R, pool.filter(function (p) { return !used[p[0]]; }));
      used[g] = true;
      chosen.push(g);
    }
    var gen = profile.gen[0] + R() * (profile.gen[1] - profile.gen[0]);
    var lines = chosen.map(function (gid) {
      var qty = ri(R, profile.qty[0], profile.qty[1]);
      var boost = demand.indexOf(gid) >= 0 ? RULES.DEMAND_OFFER : RULES.DEMAND_PENALTY;
      var offer = Math.round(GOODS[GIDX[gid]].sell * boost * gen);
      return { good: gid, qty: qty, offer: offer };
    });
    var budget = lines.reduce(function (s, l) { return s + l.qty * l.offer; }, 0);
    return { profile: profile.id, lines: lines, budget: budget };
  }

  /* ---------- État ---------- */
  function newGame(seed, lang) {
    if (!LANGS.includes(lang)) lang = "en";
    var R = mulberry32(hashSeed(String(seed)));
    var days = [];
    var prevDem = null;
    for (var d = 1; d <= RULES.DAYS; d++) { var dd = genDay(R, d, prevDem); days.push(dd); prevDem = dd.demand; }
    var stock = {};
    GOODS.forEach(function (g) { stock[g.id] = []; }); // âges (en jours) par unité
    return {
      seed: String(seed), lang: lang, over: false, won: false, bankrupt: false,
      day: 1, phase: "buy",           // buy | serve | close | upgrade | result
      capital: RULES.START_CAPITAL,
      stock: stock, cart: { berries: 0, lantern: 0, wool: 0, tea: 0 },
      custIdx: 0, upgrade: null,
      servedCount: 0, revenue: 0, bestDayGain: 0,
      ledger: null,                   // journal du jour en cours
      dayGains: [],                   // gain net par journée terminée
      days: days, lastRecap: null
    };
  }

  /* ---------- Marché du matin ---------- */
  function buyPrice(state, goodId) {
    var d = state.days[state.day - 1];
    return Math.max(1, Math.round(GOODS[GIDX[goodId]].buy * d.mult[GIDX[goodId]]));
  }
  function yesterdayPrice(state, goodId) {
    if (state.day <= 1) return null;
    var d = state.days[state.day - 2];
    return Math.max(1, Math.round(GOODS[GIDX[goodId]].buy * d.mult[GIDX[goodId]]));
  }
  function capacity(state) {
    return RULES.CAPACITY + (state.upgrade === "shelf" ? RULES.SHELF_EXTRA : 0);
  }
  function stockCount(state) {
    var n = 0;
    GOODS.forEach(function (g) { n += state.stock[g.id].length; });
    return n;
  }
  function cartCount(state) {
    var n = 0;
    GOODS.forEach(function (g) { n += state.cart[g.id]; });
    return n;
  }
  function cartCost(state) {
    var c = 0;
    GOODS.forEach(function (g) { c += state.cart[g.id] * buyPrice(state, g.id); });
    return c;
  }
  /* addToCart : retourne {ok, reason} — jamais d'achat invalide silencieux */
  function addToCart(state, goodId, qty) {
    qty = qty || 1;
    if (qty < 0) qty = 0;
    var room = capacity(state) - stockCount(state) - cartCount(state);
    if (room <= 0) return { ok: false, reason: "noRoom" };
    qty = Math.min(qty, room);
    var afford = Math.floor((state.capital - cartCost(state)) / buyPrice(state, goodId));
    qty = Math.min(qty, Math.max(0, afford));
    if (qty <= 0) return { ok: false, reason: "cantAfford" };
    state.cart[goodId] += qty;
    return { ok: true, qty: qty };
  }
  function removeFromCart(state, goodId, qty) {
    qty = Math.min(qty || 1, state.cart[goodId]);
    state.cart[goodId] -= qty;
    return { ok: true, qty: qty };
  }
  /* commitBuy : applique le panier (aucun changement si invalide) */
  function commitBuy(state) {
    var cost = cartCost(state);
    var total = stockCount(state) + cartCount(state);
    if (cost > state.capital || total > capacity(state)) return { ok: false };
    GOODS.forEach(function (g) {
      for (var i = 0; i < state.cart[g.id]; i++) state.stock[g.id].push(0); // âge 0
      state.cart[g.id] = 0;
    });
    state.capital -= cost;
    state.ledger = { purchases: cost, sales: [], fee: 0 };
    state.phase = "serve";
    state.custIdx = 0;
    return { ok: true, cost: cost };
  }

  /* ---------- Fraîcheur et paiements ---------- */
  function freshFactor(state, age) {
    var decay = state.upgrade === "icebox" ? RULES.ICEBOX_DECAY : RULES.FRESH_DECAY;
    return Math.max(RULES.FRESH_MIN, 100 - decay * age) / 100;
  }
  /* effectiveOffer : le ballon-enseigne majore les offres (à partir de son achat) */
  function effectiveOffer(state, offer) {
    return state.upgrade === "sign" ? Math.round(offer * RULES.SIGN_BONUS) : offer;
  }
  /* quoteLine : devis exact FIFO (les plus vieux partent d'abord), sans modifier l'état */
  function quoteLine(state, line, deliverQty) {
    var offer = effectiveOffer(state, line.offer);
    var ages = state.stock[line.good].slice().sort(function (a, b) { return b - a; })
      .slice(0, Math.min(deliverQty, line.qty, state.stock[line.good].length));
    var units = ages.map(function (age) {
      var f = freshFactor(state, age);
      return { age: age, factor: f, pay: Math.round(offer * f) };
    });
    var sum = units.reduce(function (s, u) { return s + u.pay; }, 0);
    return { offer: offer, units: units, sum: sum, count: units.length };
  }
  function customerQuote(state, cust, deliveries) {
    var lines = cust.lines.map(function (l, i) {
      var q = quoteLine(state, l, deliveries[i] || 0);
      return { good: l.good, qty: l.qty, offer: q.offer, count: q.count, sum: q.sum, units: q.units };
    });
    var total = lines.reduce(function (s, l) { return s + l.sum; }, 0);
    var budgetFresh = cust.lines.reduce(function (s, l) {
      return s + l.qty * effectiveOffer(state, l.offer);
    }, 0);
    return { lines: lines, total: total, budget: budgetFresh };
  }
  /* sell : livre selon les quantités choisies. Validation stricte. */
  function sell(state, deliveries) {
    if (state.phase !== "serve") return { ok: false, reason: "phase" };
    var cust = state.days[state.day - 1].customers[state.custIdx];
    if (!cust) return { ok: false, reason: "cust" };
    var quote = customerQuote(state, cust, deliveries);
    // retire réellement les unités (FIFO : les plus vieilles d'abord)
    quote.lines.forEach(function (l) {
      var remaining = l.count;
      var arr = state.stock[l.good].slice().sort(function (a, b) { return b - a; });
      while (remaining > 0 && arr.length) {
        var age = arr.shift();
        var idx = state.stock[l.good].indexOf(age);
        state.stock[l.good].splice(idx, 1);
        remaining--;
      }
    });
    var gain = quote.total;
    if (gain > 0) { state.servedCount++; }
    if (!state.ledger) state.ledger = { purchases: 0, sales: [], fee: 0 };
    state.revenue += gain;
    state.ledger.sales.push({ name: cust.profile, gain: gain, day: state.day });
    state.capital += gain;
    var mood = gain <= 0 ? "away" : (gain * 2 >= quote.budget ? "happy" : (gain * 4 >= quote.budget ? "ok" : "sad"));
    state.lastRecap = { gain: gain, mood: mood, lines: quote.lines, budget: quote.budget };
    nextCustomer(state);
    return { ok: true, recap: state.lastRecap };
  }
  function turnAway(state) {
    if (state.phase !== "serve") return { ok: false };
    var cust = state.days[state.day - 1].customers[state.custIdx];
    state.lastRecap = { gain: 0, mood: "away", lines: [], budget: cust ? cust.budget : 0 };
    nextCustomer(state);
    return { ok: true, recap: state.lastRecap };
  }
  function nextCustomer(state) {
    state.custIdx++;
    if (state.custIdx >= RULES.CUSTOMERS_PER_DAY) {
      state.phase = "close";
    }
  }
  function currentCustomer(state) {
    if (state.phase !== "serve") return null;
    return state.days[state.day - 1].customers[state.custIdx] || null;
  }

  /* ---------- Fin de journée ---------- */
  function closeDay(state) {
    if (state.phase !== "close") return { ok: false };
    if (!state.ledger) state.ledger = { purchases: 0, sales: [], fee: 0 };
    var fee = RULES.MOORING_FEE;
    state.ledger.fee = fee;
    state.capital -= fee;
    var freshN = 0;
    GOODS.forEach(function (g) {
      if (g.fresh) {
        freshN += state.stock[g.id].length;
        state.stock[g.id] = state.stock[g.id].map(function (a) { return a + 1; });
      }
    });
    state.dayGains.push(state.ledger.sales.reduce(function (s, x) { return s + x.gain; }, 0) - state.ledger.purchases - fee);
    if (state.capital < 0) {
      state.over = true; state.bankrupt = true; state.won = false; state.phase = "result";
      return { ok: true, bankrupt: true };
    }
    if (state.day >= RULES.DAYS) {
      state.over = true;
      state.won = state.capital >= RULES.GOAL;
      state.phase = "result";
      return { ok: true, end: true, won: state.won };
    }
    state.day++;
    state.phase = (state.day === RULES.UPGRADE_DAY && !state.upgrade) ? "upgrade" : "buy";
    return { ok: true, freshAged: freshN, fee: fee };
  }

  /* ---------- Amélioration (jour 5) ---------- */
  function chooseUpgrade(state, id) {
    if (state.phase !== "upgrade") return { ok: false };
    if (["shelf", "sign", "icebox"].indexOf(id) < 0) return { ok: false };
    state.upgrade = id;
    state.phase = "buy";
    return { ok: true };
  }

  /* ---------- Vue pour l'UI ---------- */
  function marketView(state) {
    var d = state.days[state.day - 1];
    return GOODS.map(function (g, i) {
      var p = buyPrice(state, g.id), y = yesterdayPrice(state, g.id);
      return {
        id: g.id, fresh: g.fresh, price: p, yesterday: y,
        trend: y === null ? "flat" : (p > y ? "up" : p < y ? "down" : "flat"),
        inDemand: d.demand.indexOf(g.id) >= 0,
        stock: state.stock[g.id].length, cart: state.cart[g.id],
        baseSell: g.sell
      };
    });
  }
  function forecast(state) {
    return state.days[state.day - 1].demand.slice();
  }

  return {
    RULES: RULES, GOODS: GOODS, PROFILES: PROFILES, LANGS: LANGS, I18N: I18N,
    tr: tr, newGame: newGame,
    buyPrice: buyPrice, yesterdayPrice: yesterdayPrice,
    capacity: capacity, stockCount: stockCount, cartCount: cartCount, cartCost: cartCost,
    addToCart: addToCart, removeFromCart: removeFromCart, commitBuy: commitBuy,

      '<div class="panel"><h2>' + esc(t("phaseBuy")) + ' · ' + esc(t("day")) + ' ' + state.day + '</h2>' + forecast +
      '<div class="market">' + cards + '</div>' +
      '<div class="cartbar"><span>' + esc(t("cartTotal")) + ' : −' + cost + ' ' + coinSVG(13) +
      ' &nbsp;·&nbsp; ' + esc(t("afterCapital")) + ' : ' + Math.max(0, after) + '</span>' +
      '<span>' + esc(t("warehouseUse")) + ' : ' + used + '/' + cap + ' ' + warn + '</span></div>' +
      '<div class="btn-row" style="margin-top:12px">' +
      '<button class="btn-primary btn-big" data-action="open-shop">' + esc(t("openShop")) + '</button></div>' +
      '</div>';
    $("phase").dataset.phase = "buy";
  }

  /* ---------- phase clients ---------- */
  var deliver = []; // quantités choisies par ligne

  function renderServe() {
    renderBar();
    var cust = E.currentCustomer(state);
    if (!cust) { return; }
    state._custProfile = cust.profile;
    renderScene("ok", true);
    var quote = E.customerQuote(state, cust, deliver);
    var name = esc(E.I18N[lang].custNames[cust.profile]);
    var blurb = esc(E.I18N[lang].custBlurbs[cust.profile]);
    var lines = cust.lines.map(function (l, i) {
      var q = quote.lines[i];
      var maxDeliver = Math.min(l.qty, state.stock[l.good].length);
      var mathBits = q.units.map(function (u) { return u.pay + (u.factor < 1 ? " (" + Math.round(u.factor * 100) + "%)" : ""); }).join(" + ");
      return '<div class="order-line">' + goodIcon(l.good, 28) +
        '<div class="order-main"><div class="order-good">' + esc(E.I18N[lang].goods[l.good]) + '</div>' +
        '<div class="order-offer">' + esc(t("asked")) + ' ×' + l.qty + ' — ' + q.offer + ' ' + coinSVG(12) + " " + esc(t("perUnit")) + '</div>' +
        (mathBits ? '<div class="order-math">= ' + mathBits + (q.count > 1 ? " = " + q.sum : "") + '</div>' : "") +
        '</div>' +
        '<div class="order-qty stepper">' +
        '<button data-action="dec" data-arg="' + i + '" ' + ((deliver[i] || 0) > 0 ? "" : "disabled") + '>−</button>' +
        '<span class="qty">' + (deliver[i] || 0) + '<span style="font-size:.7em;color:var(--ink-soft)">/' + l.qty + '</span></span>' +
        '<button data-action="inc" data-arg="' + i + '" ' + ((deliver[i] || 0) < maxDeliver ? "" : "disabled") + '>+</button>' +
        '</div></div>';
    }).join("");
    $("phase").innerHTML =
      '<div class="cust-card">' +
      '<div class="cust-head"><div class="cust-avatar">' + customerSVG(cust.profile, "ok") + '</div>' +
      '<div><div class="cust-name">' + name + '</div><div class="cust-blurb">' + blurb + '</div></div>' +
      '<div style="margin-left:auto;text-align:right;font-size:.8rem;color:var(--ink-soft)">' + esc(t("budget")) + '<br><b style="font-size:1.05rem;color:var(--ink)">' + quote.budget + ' ' + coinSVG(13) + '</b></div></div>' +
      lines +
      '<div class="payrow"><span>' + esc(t("paymentNow")) + '</span><span class="amount">' + quote.total + ' ' + coinSVG(16) + '</span></div>' +
      '<div class="cust-actions">' +
      '<button class="btn-primary btn-big" data-action="sell" ' + (quote.total > 0 ? "" : "disabled") + '>' + esc(t("serve")) + '</button>' +
      '<button data-action="away">' + esc(t("turnAway")) + '</button></div>' +
      '</div>';
    $("phase").dataset.phase = "serve";
  }

  function renderRecap() {
    renderBar();
    var r = state.lastRecap;
    var moodKey = r.mood === "happy" ? "happySell" : r.mood === "ok" ? "okSell" : r.mood === "sad" ? "sadSell" : "awayLine";
    renderScene(r.mood, true);
    var bubble = $("moodbubble");
    if (bubble) bubble.textContent = t(moodKey);
    var last = state.custIdx >= E.RULES.CUSTOMERS_PER_DAY;
    $("phase").innerHTML =
      '<div class="panel recap-card">' +
      (r.gain > 0
        ? '<div class="amount">+' + r.gain + ' ' + coinSVG(22) + '</div><div class="recap-mood">' + esc(t(moodKey)) + '</div>'
        : '<div class="amount sad">0 ' + coinSVG(22) + '</div><div class="recap-mood">' + esc(t(moodKey)) + '</div>') +
      '<button class="btn-mint btn-big" data-action="' + (last ? "end-day" : "next-cust") + '">' +
      esc(t(last ? "phaseClose" : "nextCustomer")) + '</button></div>';
    $("phase").dataset.phase = "recap";
  }

  /* ---------- fin de journée ---------- */
  function renderDayEnd(dayNum, info) {
    var rows = "";
    var l = state.ledger;
    if (l.purchases > 0) rows += '<tr><td>' + esc(t("purchases")) + '</td><td class="num minus">−' + l.purchases + '</td></tr>';
    l.sales.forEach(function (s, i) {
      var nm = E.I18N[lang].custNames[s.name] || s.name;
      rows += '<tr><td>' + esc(t("sales")) + ' · ' + esc(nm) + '</td><td class="num plus">+' + s.gain + '</td></tr>';
    });
    rows += '<tr><td>' + esc(t("mooring")) + '</td><td class="num minus">−' + E.RULES.MOORING_FEE + '</td></tr>';
    var aged = info && info.freshAged ? t("aged", { n: info.freshAged, s: info.freshAged > 1 ? "s" : "" }) : "";
    openModal('<h2>' + esc(t("dayEndTitle", { d: dayNum })) + '</h2>' +
      '<table class="ledger">' + rows +
      '<tr class="total"><td>' + esc(t("capitalNow")) + '</td><td class="num">' + state.capital + ' ' + coinSVG(14) + '</td></tr></table>' +
      (aged ? '<p class="hint">' + esc(aged) + '</p>' : "") +
      '<div class="btn-row"><button class="btn-primary btn-big" data-action="next-day">' + esc(t("nextDay")) + '</button></div>');
  }

  /* ---------- amélioration ---------- */
  function renderUpgrade() {
    renderBar(); renderScene(null, false);
    var ups = [
      { id: "shelf", title: "upShelfT", desc: "upShelfD" },
      { id: "sign", title: "upSignT", desc: "upSignD" },
      { id: "icebox", title: "upIceT", desc: "upIceD" }
    ].map(function (u) {
      return '<div class="upg-card">' + upgIcon(u.id) +
        '<div><b>' + esc(t(u.title)) + '</b><div class="hint">' + esc(t(u.desc)) + '</div></div>' +
        '<button class="btn-mint" data-action="upg" data-arg="' + u.id + '">' + esc(t("choose")) + '</button></div>';
    }).join("");
    $("phase").innerHTML =
      '<div class="panel"><h2>' + esc(t("upgradeTitle")) + '</h2>' +
      '<p class="hint">' + esc(t("upgradeOnce")) + '</p><div class="upgrades">' + ups + '</div></div>';
    $("phase").dataset.phase = "upgrade";
  }

  /* ---------- résultat ---------- */
  function renderResult() {
    var won = state.won;
    var bestDay = state.dayGains.length ? Math.max.apply(null, state.dayGains) : 0;
    if (best === null || state.capital > best) {
      best = state.capital; store("best", String(best));
    }
    $("result").innerHTML =
      '<div class="scene' + (won ? " lift-off" : "") + '" style="border:none;background:none;box-shadow:none">' + sceneSVG() + '</div>' +
      '<h2 class="result-title">' + esc(t(won ? "winTitle" : state.bankrupt ? "bankruptTitle" : "loseTitle")) + '</h2>' +
      '<p class="tagline">' + esc(t(state.bankrupt ? "bankruptLine" : won ? "winLine" : "loseLine", { goal: E.RULES.GOAL })) + '</p>' +
      '<div class="stats">' +
      '<div class="stat"><div class="v">' + state.capital + '</div><div class="k">' + esc(t("statFinal")) + '</div></div>' +
      '<div class="stat"><div class="v">' + state.revenue + '</div><div class="k">' + esc(t("statRevenue")) + '</div></div>' +
      '<div class="stat"><div class="v">' + state.servedCount + '</div><div class="k">' + esc(t("statServed")) + '</div></div>' +
      '<div class="stat"><div class="v">' + (bestDay > 0 ? "+" + bestDay : bestDay) + '</div><div class="k">' + esc(t("statBest")) + '</div></div>' +
      '</div>' +
      '<div class="btn-row">' +
      '<button class="btn-primary btn-big" data-action="again">' + esc(t("again")) + '</button>' +
      '<button data-action="same-seed">' + esc(t("sameSeed")) + '</button></div>' +
      '<p class="home-meta">' + esc(t("seedLabel")) + ' : ' + esc(state.seed) + '</p>';
    show("result");
    if (won) { SND.win(); confetti(); } else { SND.lose(); }
  }

  function confetti() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var c = document.createElement("div");
    c.className = "confetti";
    var cols = ["#e2624b", "#e8b64c", "#6fbf9b", "#7fb2dd", "#e8a0b4"];
    for (var i = 0; i < 60; i++) {
      var p = document.createElement("i");
      p.style.left = (Math.random() * 100) + "vw";
      p.style.background = cols[i % 5];
      p.style.animationDuration = (1.6 + Math.random() * 1.8) + "s";
      p.style.animationDelay = (Math.random() * .8) + "s";
      c.appendChild(p);
    }
    document.body.appendChild(c);
    setTimeout(function () { c.remove(); }, 4200);
  }

  /* ---------- flux de jeu ---------- */
  function newRun(seed) {
    state = E.newGame(seed, lang);
    lastSeedShown = seed;
    show("game");
    if (state.phase === "upgrade") renderUpgrade(); else renderBuy();
  }

  function startServePhase() {
    deliver = [];
    renderServe();
    SND.bell();
  }

  /* ---------- events (délégation) ---------- */
  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    var arg = el.getAttribute("data-arg");
    ac(); // déverrouille l'audio au premier geste
    switch (action) {
      case "play": newRun(String(Math.floor(Math.random() * 1e9))); SND.whoosh(); break;
      case "rules": renderRulesModal(); break;
      case "rules2": renderRulesModal(); break;
      case "close-modal": closeModal(); break;
      case "sound":
        muted = !muted; store("muted", muted ? "1" : "0");
        renderBar(); if ($("phase").dataset.phase === "buy") renderBuy();
        if (state && state.phase === "serve") renderServe();
        if (state && state.phase === "upgrade") renderUpgrade();
        break;
      case "add": E.addToCart(state, arg, 1); SND.plop(); renderBuy(); break;
      case "rem": E.removeFromCart(state, arg, 1); renderBuy(); break;
      case "open-shop":
        E.commitBuy(state); // panier vide autorisé : journée sans achat
        startServePhase();
        break;
      case "inc":
        deliver[+arg] = (deliver[+arg] || 0) + 1; renderServe(); break;
      case "dec":
        deliver[+arg] = Math.max(0, (deliver[+arg] || 0) - 1); renderServe(); break;
      case "sell":
        var r = E.sell(state, deliver);
        if (r.ok) { SND.coin(); renderRecap(); }
        break;
      case "away":
        E.turnAway(state); SND.plop(); renderRecap(); break;
      case "next-cust":
        deliver = []; renderServe(); SND.bell(); break;
      case "end-day": {
        closeModal();
        var dayNum = state.day;
        var info = E.closeDay(state);
        if (state.over) { renderResult(); }
        else {
          renderDayEnd(dayNum, info); // état déjà avancé : on affiche le jour clôturé
          SND.whoosh();
        }
        break;
      }
      case "next-day":
        closeModal();
        if (state.phase === "upgrade") renderUpgrade(); else renderBuy();
        break;
      case "upg":
        E.chooseUpgrade(state, arg); SND.coin(); renderBuy(); break;
      case "again": newRun(String(Math.floor(Math.random() * 1e9))); break;
      case "same-seed": newRun(state.seed); break;
    }
  });

  /* ---------- boot ---------- */
  function boot() {
    lang = store("lang") || "en";
    if (["en", "fr", "es"].indexOf(lang) < 0) lang = "en";
    muted = store("muted") === "1";
    var b = store("best"); if (b !== null && !isNaN(+b)) best = +b;
    var q = new URLSearchParams(location.search);
    if (q.get("lang") && E.LANGS.indexOf(q.get("lang")) >= 0) lang = q.get("lang");
    var app = document.getElementById("app");
    app.innerHTML =
      '<section id="home" class="screen"></section>' +
      '<section id="game" class="screen"><div id="bar"></div><div class="scene" id="scene"></div><main id="phase"></main></section>' +
      '<section id="result" class="screen"></section>';
    renderHome();
    if (q.get("seed")) newRun(q.get("seed"));
    // QA : hook lecture seule + pilotage
    window.__bazar = {
      get state() { return state; },
      E: E,
      lang: function () { return lang; },
      setLang: function (l) { lang = l; if (state) { state.lang = l; } renderHome(); },
      actions: function (a, arg) { document.querySelector('[data-action="' + a + '"]' + (arg ? '[data-arg="' + arg + '"]' : "")).click(); }
    };
    document.body.dataset.booted = "1";
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
/*Bazar-APP-END*/

</script>
</body>
</html>
